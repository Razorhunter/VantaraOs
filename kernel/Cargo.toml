[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
build = "build.rs"
authors = ["Mohammad Hafifi Abu Bakar"]
description = "Vantara System OS Kernel"
license = "Apache-2.0 license"

[features]
default = ["storage-auto"]
ahci-vantfs-test = []
ahci-write-test = []
nvme-write-test = []
usb-write-test = []
framebuffer-vga = ["bootloader/vga_320x200"]
modern-boot = ["dep:bootloader_api"]
kernel-thread-preemption-test = []
storage-ahci = []
storage-auto = []
storage-ata = []
storage-nvme = []

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
bootloader_api = { version = "=0.11.15", optional = true }
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = { version = "0.15.0", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.1"

[dependencies.lazy_static]
version = "1.4.0"
features = ["spin_no_std"]

[profile.dev]
panic = "abort"

[profile.test]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "kernel"
test = true
bench = false

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 300

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
